<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxttXNlCNZFLgdLS4w50ya_Ne1cwsVvmvPNmLLxy8dMZUZz91VMiDX3QpF2hWPhQHcw/exec";

/*
  API Key خودت را اینجا قرار بده.
  خود API Key را برای من ارسال نکن.
*/
const API_KEY = "Ardestan_API_2026_9Kx7P2mQ";


/* =========================================================
   STATE
   ========================================================= */

let mode = "guest";
let transactions = [];
let editingId = null;


/* =========================================================
   MODE
   ========================================================= */

function selectMode(selectedMode) {

  mode = selectedMode;

  const guestBtn =
    document.getElementById("guestModeBtn");

  const adminBtn =
    document.getElementById("adminModeBtn");

  const guestArea =
    document.getElementById("guestLoginArea");

  const adminArea =
    document.getElementById("adminLoginArea");

  if (mode === "admin") {

    adminBtn.classList.add("active");
    guestBtn.classList.remove("active");

    adminArea.classList.remove("hidden");
    guestArea.classList.add("hidden");

  } else {

    guestBtn.classList.add("active");
    adminBtn.classList.remove("active");

    adminArea.classList.add("hidden");
    guestArea.classList.remove("hidden");

  }

}


function enterGuest() {

  mode = "guest";

  openApp();

}


function loginAdmin() {

  const key =
    document.getElementById("adminKey").value.trim();

  if (!key) {

    toast("API Key را وارد کن.", true);

    return;

  }

  if (key !== API_KEY) {

    toast("API Key اشتباه است.", true);

    return;

  }

  mode = "admin";

  openApp();

}


function openApp() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  document
    .getElementById("modeLabel")
    .textContent =
      mode === "admin"
        ? "Admin Mode"
        : "Guest Mode";


  if (mode === "admin") {

    document
      .getElementById("addBtn")
      .classList.remove("hidden");

    document
      .getElementById("actionHeader")
      .classList.remove("hidden");

  } else {

    document
      .getElementById("addBtn")
      .classList.add("hidden");

    document
      .getElementById("actionHeader")
      .classList.add("hidden");

  }


  loadTransactions();

}


function logout() {

  transactions = [];

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


/* =========================================================
   API
   ========================================================= */

async function apiGet(action) {

  const url =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&key=" +
    encodeURIComponent(API_KEY);

  const response =
    await fetch(url);

  const data =
    await response.json();

  if (!data.ok) {

    throw new Error(
      data.error || "API Error"
    );

  }

  return data;

}


async function apiPost(payload) {

  payload.key = API_KEY;

  const response =
    await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(payload)

    });

  const data =
    await response.json();

  if (!data.ok) {

    throw new Error(
      data.error || "API Error"
    );

  }

  return data;

}


/* =========================================================
   LOAD
   ========================================================= */

async function loadTransactions() {

  try {

    const data =
      await apiGet("transactions");

    transactions =
      data.transactions || [];

    render();

    toast("اطلاعات با موفقیت بروزرسانی شد.");

  } catch (error) {

    console.error(error);

    toast(
      "خطا در دریافت اطلاعات: " +
      error.message,
      true
    );

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const type =
    document
      .getElementById("typeFilter")
      .value;


  let filtered =
    transactions.filter(t => {

      const text = [

        t.customer,
        t.product,
        t.type,
        t.notes,
        t.unit

      ]
      .join(" ")
      .toLowerCase();


      const matchesSearch =
        !search ||
        text.includes(search);


      const matchesType =
        !type ||
        t.type === type;


      return (
        matchesSearch &&
        matchesType
      );

    });


  const body =
    document.getElementById(
      "transactionsBody"
    );


  if (!filtered.length) {

    body.innerHTML = `
      <tr>
        <td colspan="11"
            style="text-align:center;padding:35px">
          هیچ معامله‌ای پیدا نشد.
        </td>
      </tr>
    `;

  } else {

    body.innerHTML =
      filtered.map(t => {

        const badgeClass =
          t.type === "فروش"
            ? "sell"
            : t.type === "خرید"
              ? "buy"
              : "";


        const actions =
          mode === "admin"
            ? `
              <div class="actions">

                <button
                  class="small-btn"
                  style="background:#2563eb"
                  onclick="editTransaction('${escapeAttr(t.id)}')">
                  ✏️
                </button>

                <button
                  class="small-btn"
                  style="background:#dc2626"
                  onclick="deleteTransaction('${escapeAttr(t.id)}')">
                  🗑
                </button>

              </div>
            `
            : "";


        return `

          <tr>

            <td>${formatDate(t.date)}</td>

            <td>${safe(t.customer || "—")}</td>

            <td>
              <span class="badge ${badgeClass}">
                ${safe(t.type || "سایر")}
              </span>
            </td>

            <td>${safe(t.product || "—")}</td>

            <td>
              ${number(t.quantity)}
              ${safe(t.unit || "")}
            </td>

            <td>
              ${money(t.rate)}
              AFN
            </td>

            <td>
              ${money(t.total)}
              AFN
            </td>

            <td>
              ${money(t.paid)}
              AFN
            </td>

            <td class="${Number(t.remaining) > 0 ? "red" : "green"}">
              ${money(t.remaining)}
              AFN
            </td>

            <td>${safe(t.notes || "—")}</td>

            <td class="${mode === "admin" ? "" : "hidden"}">
              ${actions}
            </td>

          </tr>

        `;

      }).join("");

  }


  updateStats(filtered);

}


function updateStats(list) {

  const count =
    list.length;

  const total =
    list.reduce(
      (sum,t) =>
        sum + Number(t.total || 0),
      0
    );

  const paid =
    list.reduce(
      (sum,t) =>
        sum + Number(t.paid || 0),
      0
    );

  const remaining =
    list.reduce(
      (sum,t) =>
        sum + Number(t.remaining || 0),
      0
    );


  document
    .getElementById("statCount")
    .textContent =
      number(count);


  document
    .getElementById("statTotal")
    .textContent =
      money(total) + " AFN";


  document
    .getElementById("statPaid")
    .textContent =
      money(paid) + " AFN";


  document
    .getElementById("statRemaining")
    .textContent =
      money(remaining) + " AFN";

}

   ========================================================= */

function openModal(transaction = null) {

  if (mode !== "admin") {

    toast("فقط Admin اجازه این کار را دارد.", true);

    return;

  }

function closeModal() {

  document.getElementById("transactionId").value =

  document.getElementById("direction").value =

  document.getElementById("notes").value =

}


function calculateTotal() {

  const quantity =
    Number(
      document.getElementById("quantity").value
    ) || 0;

  const rate =
    Number(
      document.getElementById("rate").value
    ) || 0;


  document.getElementById("total").value =
    quantity * rate;

}

async function saveTransaction(event) {

  event.preventDefault();


  if (mode !== "admin") {

    return;

  }


  const transaction = {

    id:
      editingId || "",

    date:

    customer:

    type:
      document.getElementById("type").value,

    product:

      ) || 0,

      ) || 0,

      ) || 0,

    direction:
      document.getElementById("direction").value,

  };


  try {

async function deleteTransaction(id) {

  if (mode !== "admin") {

    toast("دسترسی غیرمجاز.", true);

    return;

  }


  const transaction =
    transactions.find(
      t => String(t.id) === String(id)
    );


  if (!transaction) {

  }


  const confirmDelete =
    confirm(
      "آیا از حذف این معامله مطمئن هستی؟\n\n" +
      (transaction.customer || "بدون نام") +
      " — " +
      (transaction.product || "بدون کالا")
    );


  if (!confirmDelete) {
    return;
  }


  try {

    await apiPost({

      action: "delete",

      id

    });


    toast("معامله حذف شد.");

    await loadTransactions();

    toast(

      error.message,
      true
    );

  }

}


/* =========================================================
   HELPERS
   ========================================================= */

function money(value) {

  return Number(value || 0)
    .toLocaleString("en-US");

}


function number(value) {

  return Number(value || 0)
    .toLocaleString("en-US");

}


function formatDate(value) {

  if (!value) {
    return "—";
  }

  const d =
    new Date(value);

  if (isNaN(d)) {
    return safe(value);
  }

  return d.toLocaleDateString(
    "fa-AF",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  );

}


function normalizeDate(value) {

  if (!value) {

    return new Date()
      .toISOString()
      .slice(0,10);

  }

  const d =
    new Date(value);

  if (isNaN(d)) {

    return String(value)
      .slice(0,10);

  }

  return d
    .toISOString()
    .slice(0,10);

}


function safe(value) {

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value) {

  return String(value ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}


function toast(message, error = false) {

  const element =
    document.getElementById("toast");

  element.textContent =
    message;

  element.style.borderColor =
    error
      ? "#ef4444"
      : "#16a34a";

  element.classList.add("show");


  setTimeout(() => {

    element.classList.remove("show");

  }, 3500);

}
