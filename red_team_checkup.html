<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED TEAM SPECIALIST ASSESSMENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- توکن‌های طراحی (طبق بخش ۲۴ مشخصات) ---------- */
:root{
  --bg:#0B0B0F; --panel:#15151F; --panel2:#101018; --line:#23232E; --line2:#2E2E3A;
  --red:#E31E27; --red-dim:#8f141a; --ok:#4CAF7D; --gray:#999A93; --white:#F8F8F8;
  --mono:'JetBrains Mono',monospace; --sans:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;opacity:.14}
#bg{position:fixed;inset:0;z-index:0;opacity:.5}
.mono{font-family:var(--mono)}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}

/* ---------- هدر و نوار پیشرفت ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(11,11,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--white);white-space:nowrap}
.brand b{color:var(--red)}
.stages{display:flex;gap:0;flex:1;justify-content:center;overflow:hidden}
.stg{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#55555f;padding:5px 12px;position:relative;white-space:nowrap}
.stg+.stg::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:12px;background:var(--line2)}
.stg.cur{color:var(--red)}.stg.cur::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--red)}
.stg.done{color:var(--gray)}.stg.done::after{content:'✓';margin-left:5px;color:var(--ok)}
.hd-r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:10px}
#saveDot{color:var(--ok);opacity:0;transition:opacity .4s}
#saveDot.on{opacity:1}
.adm-link{color:var(--gray);text-decoration:none;letter-spacing:.12em;border:1px solid var(--line2);padding:5px 10px;transition:.2s}
.adm-link:hover{color:var(--white);border-color:var(--gray)}

/* ---------- چیدمان عمومی ---------- */
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:34px 20px 90px}
.wrap{max-width:860px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:26px 28px;position:relative}
.panel.acc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--red);border-radius:6px 6px 0 0}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--red);margin-bottom:10px}
.sec-label.g{color:var(--gray)}
h1{font-size:clamp(30px,5vw,52px);font-weight:700;line-height:1.04;letter-spacing:-.01em}
h2{font-size:clamp(20px,3vw,28px);font-weight:600}
p.lead{color:var(--gray);font-size:15px;line-height:1.65}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  padding:14px 26px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;border-radius:3px;
  transition:.18s;text-transform:uppercase}
.btn:hover{background:#c1161e;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--white);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--gray);background:rgba(255,255,255,.03)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.sm{padding:9px 16px;font-size:10px}
.term{font-family:var(--mono);font-size:12px;color:var(--gray);line-height:1.8}
.term .p{color:var(--red)}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:3px 8px;border:1px solid var(--line2);color:var(--gray);border-radius:2px}
.tag.red{border-color:var(--red-dim);color:#ff7b81;background:rgba(227,30,39,.07)}
.tag.ok{border-color:#2b5c42;color:var(--ok);background:rgba(76,175,125,.07)}
.tag.wh{border-color:var(--gray);color:var(--white)}

/* ---------- ورودی‌ها ---------- */
label.fl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gray);margin:18px 0 7px}
label.fl b{color:var(--red)}
input[type=text],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--white);
  font-family:var(--mono);font-size:13px;padding:12px 14px;border-radius:3px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:11px;padding:8px 13px;border:1px solid var(--line2);color:var(--gray);
  cursor:pointer;border-radius:3px;transition:.15s;user-select:none}
.chip:hover{border-color:var(--gray);color:var(--white)}
.chip.on{border-color:var(--red);color:#ff8d93;background:rgba(227,30,39,.08)}

/* ---------- گزینه‌های آزمون ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{border:1px solid var(--line2);border-radius:4px;padding:15px 17px;cursor:pointer;transition:.15s;display:flex;gap:13px;align-items:flex-start;background:var(--panel2)}
.opt:hover{border-color:var(--gray)}
.opt.sel{border-color:var(--red);background:rgba(227,30,39,.07)}
.opt .mk{font-family:var(--mono);font-size:11px;color:var(--gray);border:1px solid var(--line2);width:24px;height:24px;min-width:24px;display:flex;align-items:center;justify-content:center;border-radius:3px;margin-top:1px}
.opt.sel .mk{border-color:var(--red);color:var(--red)}
.opt .tx{font-size:14px;line-height:1.55;color:#d6d6d2}
.opt.sel .tx{color:var(--white)}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px;flex-wrap:wrap}
.qmeta{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gray);display:flex;gap:16px}

/* ---------- نوارها و متریک‌ها ---------- */
.barrow{display:grid;grid-template-columns:190px 1fr 62px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.barrow:last-child{border-bottom:0}
.bl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--gray)}
.btrack{height:5px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bfill{height:100%;background:var(--gray);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bfill.red{background:var(--red)}.bfill.ok{background:var(--ok)}
.bv{font-family:var(--mono);font-size:12px;color:var(--white);text-align:right}
.statgrid{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{flex:1 1 140px;padding:18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:700}
.stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--gray);margin-top:4px}

/* ---------- لیست تخصص‌ها ---------- */
.specrow{border:1px solid var(--line);border-radius:5px;margin-bottom:9px;background:var(--panel);overflow:hidden;transition:border .2s}
.specrow:hover{border-color:var(--line2)}
.specrow.open{border-color:var(--red-dim)}
.spec-hd{display:flex;align-items:center;gap:16px;padding:15px 18px;cursor:pointer;user-select:none}
.spec-hd .no{font-family:var(--mono);font-size:11px;color:var(--gray);width:26px}
.spec-hd .nm{font-size:15px;font-weight:600;flex:1}
.spec-hd .int{font-family:var(--mono);font-size:9px;letter-spacing:.12em;border:1px solid var(--line2);color:var(--gray);padding:5px 11px;border-radius:3px;cursor:pointer;transition:.15s;white-space:nowrap}
.spec-hd .int:hover{border-color:var(--red);color:#ff8d93}
.spec-hd .int.on{border-color:var(--red);color:#fff;background:var(--red)}
.spec-bd{max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:0 solid var(--line)}
.specrow.open .spec-bd{max-height:520px;border-top:1px solid var(--line)}
.spec-bd-in{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.spec-bd h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--red);margin-bottom:7px}
.spec-bd p{font-size:12.5px;line-height:1.65;color:#c9c9c4}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
@media(max-width:700px){.spec-bd-in{grid-template-columns:1fr}.barrow{grid-template-columns:120px 1fr 50px}}

/* ---------- گزارش / تلگرام ---------- */
.rolecard{border:1px solid var(--line);border-radius:6px;padding:22px 24px;background:var(--panel);position:relative}
.rolecard.primary{border-color:var(--red)}
.rolecard .rk{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--gray)}
.rolecard .rn{font-size:20px;font-weight:700;margin:8px 0 4px}
.rolecard .rf{font-family:var(--mono);font-size:26px;color:var(--red)}
.tgprev{background:#0e1621;border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:var(--mono)}
.flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--gray)}
.flowline .st{padding:5px 10px;border:1px solid var(--line2);border-radius:3px}
.flowline .st.hit{border-color:var(--red);color:var(--red)}
.flowline .ar{color:#44444f}

/* ---------- ادمین ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--gray);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th:hover{color:var(--white)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:#cfcfca}
.tbl tr.rrow{cursor:pointer;transition:.15s}
.tbl tr.rrow:hover td{background:rgba(255,255,255,.03)}
.drawer{position:fixed;top:0;right:-560px;width:min(540px,100vw);height:100vh;background:var(--panel);border-left:1px solid var(--line2);z-index:80;transition:right .3s ease;overflow-y:auto;padding:28px}
.drawer.open{right:0}
.dimgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ---------- توست ---------- */
#toasts{position:fixed;bottom:22px;left:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--red);padding:13px 18px;border-radius:4px;
  font-family:var(--mono);font-size:11.5px;color:var(--white);max-width:340px;animation:tin .3s ease}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fadein{animation:fin .45s ease}
@keyframes fin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:900px){.stages{display:none}.stat{flex:1 1 110px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header>
  <div class="hd-in">
    <div class="brand mono"><b>RT/</b>ASSESS</div>
    <nav class="stages" id="stages"></nav>
    <div class="hd-r">
      <span id="saveDot">● SAVED</span>
      <a href="#" class="adm-link" onclick="go('admin');return false">ADMIN</a>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="toasts"></div>

<script>
/* =====================================================================
   RED TEAM SPECIALIST ASSESSMENT — نسخهٔ تک‌فایل کاملاً کارکردی
   این نسخه، لایهٔ سرور (بخش ۲۱/۲۹ spec) را با «دیتابیس محلی» شبیه‌سازی
   می‌کند: ذخیرهٔ هر پاسخ بلافاصله، session token، و لاگ تلگرام.
   در پروداکشن: Next.js + FastAPI + PostgreSQL + JWT طبق بخش ۲۹.
===================================================================== */
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>new Date().toISOString();
const uid=()=>'RT-'+Math.random().toString(36).slice(2,6).toUpperCase()+String(Date.now()).slice(-3);
function toast(m,ok){const t=document.createElement('div');t.className='toast'+(ok?' ok':'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),400)},3400)}
function flashSaved(){const d=$('#saveDot');d.classList.add('on');clearTimeout(flashSaved._t);flashSaved._t=setTimeout(()=>d.classList.remove('on'),1400)}

/* ---------- ۲. بانک هویت تخصص‌ها (بخش ۵/۶) ---------- */
const SPECS=[
{id:'rto', n:'Red Team Operator', f:'Full-scope adversary emulation: planning and executing multi-stage covert operations against live defenses — from initial access to crown-jewel objectives.', sc:'You hold quiet foothold for two weeks, pivot laterally while blue team hunts you, and reach the objective without triggering response.', t:['patience','tradecraft','adaptability','deep networking + AD'], dims:['persistence','adaptability','problem_solving'], areas:['Networking','Linux','Active Directory','Exploitation']},
{id:'pt', n:'Penetration Tester', f:'Breadth across infrastructure, network and applications within defined scopes — find real, exploitable risk and communicate it clearly.', sc:'A scoped two-week engagement: map the environment, chain low findings into a domain compromise, then write the report the client acts on.', t:['methodology','breadth','communication','prioritization'], dims:['problem_solving','analytical','learning'], areas:['Networking','Linux','Windows','Web Security','Exploitation']},
{id:'web', n:'Web / API Pentester + Bug Bounty', f:'Deep application-layer offense: business-logic abuse, authentication and authorization flaws, API misuse, and high-signal recon at scale.', sc:'A thick-client leaks an internal API. You map undocumented endpoints, find object-level authorization gaps, and chain them to account takeover.', t:['persistence','attention to detail','HTTP mastery','automation'], dims:['analytical','research','curiosity'], areas:['Web Security','Programming','Networking']},
{id:'ad', n:'Active Directory / Windows Operator', f:'Identity-focused offense: Kerberos abuse, ACL attack paths, delegation flaws and domain escalation in Windows enterprise estates.', sc:'You land on a workstation with no privileges. Through ACL misconfigurations and Kerberoasting you reach DA in four quiet steps.', t:['Windows internals','graph thinking','enumeration discipline'], dims:['analytical','persistence','research'], areas:['Windows','Active Directory','Networking']},
{id:'osint', n:'OSINT / Recon Specialist', f:'Passive intelligence: mapping people, infrastructure and exposure before a packet touches the target — then turning noise into actionable targeting.', sc:'From one corporate email you reconstruct the org chart, remote-access portals, leaked credentials and a supplier with VPN trust.', t:['research obsession','correlation','analyst OPSEC'], dims:['research','curiosity','persistence'], areas:['OSINT','Networking']},
{id:'cloud', n:'Cloud Red Teamer', f:'Offense in AWS/Azure/GCP: IAM escalation chains, token abuse, cross-account trust exploitation and identity perimeter bypass.', sc:'A SSRF in an internal tool reaches the metadata service; the assumed role can PassRole — you escalate to org-wide admin without touching a single VM.', t:['IAM depth','architecture thinking','automation'], dims:['analytical','curiosity','learning'], areas:['Cloud','Linux','Programming']},
{id:'xdev', n:'Exploit Dev / Vulnerability Research', f:'Finding and weaponizing the unknown: memory corruption, fuzzing at scale, patch diffing and reliable exploit chains against hardened targets.', sc:'A crasher from your fuzzer is a heap overflow in a browser IPC path. Months later it is a full sandbox-escape chain with reliable primitives.', t:['low-level mastery','ruthless persistence','creativity'], dims:['analytical','creativity','persistence'], areas:['Programming','Exploitation','Reverse Engineering']},
{id:'rev', n:'Reverse Engineering / Malware Research', f:'Understanding binaries you have no source for: static and dynamic analysis, unpacking, protocol recovery and threat actor tooling analysis.', sc:'A packed loader with no strings lands on your desk. In two days you recover the C2 protocol, config schema and a new persistence trick.', t:['patience','pattern recognition','assembly fluency'], dims:['analytical','curiosity','persistence'], areas:['Reverse Engineering','Programming','Windows']},
{id:'c2', n:'C2 / Offensive Tool Developer', f:'Building the operator\'s toolkit: implants, tasking, redirector chains, malleable profiles and tooling that survives real defenses.', sc:'Your implant must sit dormant behind a strict proxy for 30 days, update itself, and never fingerprint — because detection burns the whole operation.', t:['software engineering','evasion thinking','reliability mindset'], dims:['creativity','problem_solving','learning'], areas:['Programming','Networking','Linux']},
{id:'se', n:'Social Engineering / Phishing Specialist', f:'Human-layer offense done ethically: pretext engineering, controlled phishing campaigns, vishing and measuring organizational resilience.', sc:'Your pretext as IT support survives two verification questions; the badge you request opens the server room — all pre-approved in the ROE.', t:['empathy + acting','pretext craft','strict ethics'], dims:['creativity','adaptability','curiosity'], areas:['OSINT','Networking']},
{id:'mob', n:'Mobile Security / Mobile Pentester', f:'Android and iOS offense: runtime instrumentation, storage and IPC flaws, TLS pinning bypass and platform security model abuse.', sc:'A banking app hides logic in native code; with Frida you trace the transaction signer and prove a replayable transfer request.', t:['platform internals','dynamic instrumentation','detail focus'], dims:['analytical','research','learning'], areas:['Mobile','Programming','Web Security']},
{id:'wifi', n:'Wireless / RF Security Specialist', f:'Attacking the air layer: WPA2/WPA3 weaknesses, rogue and evil-twin access points, SDR-driven signal analysis and RF protocol abuse.', sc:'From the parking lot you deploy an evil twin, harvest domain credentials against WPA2-Enterprise and pivot straight into the internal VLAN.', t:['radio curiosity','protocol depth','field craft'], dims:['curiosity','analytical','research'], areas:['Wireless','Networking','Linux']},
{id:'iot', n:'IoT / Hardware Security Specialist', f:'Attacking the physical layer: UART/JTAG access, firmware extraction and analysis, embedded Linux hardening gaps and RF replay.', sc:'Four solder points and a 115200 baud console later, you have root on the smart lock — and its firmware ships a hardcoded support account.', t:['hardware hands-on','firmware analysis','tinkering drive'], dims:['curiosity','creativity','persistence'], areas:['Hardware/IoT','Reverse Engineering','Wireless','Linux']}
];
const specById=id=>SPECS.find(s=>s.id===id);

/* ---------- ۷. سنجش طرز فکر — ۵ سؤال × ۳ نسخه (بخش ۷) ---------- */
const MINDSET=[
{dim:'analytical', vs:[
 {s:'Three hours into an engagement, your exploit crashes the target service — but only on the third request in a row. It never fails on the first two.', o:[
  {t:'Diff the three requests byte by byte and form a hypothesis about what state changes before crashing.',s:{analytical:3,problem_solving:2}},
  {t:'Fire it repeatedly with slight variations until you find a reliable pattern by trial and error.',s:{persistence:2,problem_solving:1}},
  {t:'Note it as "unreliable" in your notes and move to a different attack surface.',s:{persistence:1,adaptability:1}},
  {t:'Search for public writeups about this exact service behavior and replicate what worked for others.',s:{research:2,learning:1}}]},
 {s:'Your manual enumeration says a host runs an old VPN gateway, but the client\'s asset dashboard lists it as fully patched. The discrepancy blocks your next step.', o:[
  {t:'Fingerprint it independently (banners, TLS cert, behavior) and reconcile the evidence before deciding.',s:{analytical:3,research:1}},
  {t:'Trust the client dashboard — their records should be more current than your guesses.',s:{analytical:0}},
  {t:'Attack both assumptions: run checks that only succeed on the unpatched version.',s:{problem_solving:2,analytical:2}},
  {t:'Email the client immediately and wait for confirmation before proceeding.',s:{persistence:1}}]},
 {s:'A payload that works perfectly on staging silently fails in production with an identical build number.', o:[
  {t:'Compare environments systematically: configs, headers, WAF, middleware — one variable at a time.',s:{analytical:3,problem_solving:2}},
  {t:'Assume the production WAF is the cause and jump straight to encoding bypasses.',s:{problem_solving:1,creativity:1}},
  {t:'Retry the same payload several times — production can be flaky.',s:{analytical:0}},
  {t:'Rebuild the payload from scratch using a different technique you know less about, to learn it.',s:{learning:2,adaptability:2}}]}]},
{dim:'persistence', vs:[
 {s:'You are six days into a two-week engagement. Every obvious door is closed and you have found nothing notable on your entire scope.', o:[
  {t:'Go back to day-one reconnaissance with fresh eyes and re-enumerate deeper layers you skimmed.',s:{persistence:3,research:2}},
  {t:'Ask the client to expand the scope — clearly there is nothing here.',s:{persistence:0}},
  {t:'Pick the least-examined asset and commit a full day to it, no matter how boring.',s:{persistence:3,analytical:1}},
  {t:'Write up what you have honestly; a thin report is still an honest report.',s:{adaptability:1}}]},
 {s:'On a bug bounty program, every finding you hunt has a duplicate submitted hours before you — three times in a row this week.', o:[
  {t:'Study what the successful hunters do differently and pick targets with less competition but real logic depth.',s:{learning:2,research:2,adaptability:2}},
  {t:'Grind faster on the same high-traffic targets — speed will eventually win.',s:{persistence:2}},
  {t:'Take a break from that program; maybe bounty hunting is not for you.',s:{persistence:0}},
  {t:'Automate your own monitoring for new assets so you are first next time.',s:{creativity:2,problem_solving:2,learning:1}}]},
 {s:'You are reversing a binary and have been stuck on the same obfuscated routine for two evenings.', o:[
  {t:'Switch approaches: run it dynamically, trace what it touches, and let behavior explain the code.',s:{adaptability:2,problem_solving:2,persistence:1}},
  {t:'Keep reading the assembly linearly until it makes sense — brute patience wins.',s:{persistence:3}},
  {t:'Skip the routine entirely; it probably does nothing important.',s:{persistence:0}},
  {t:'Document exactly what you understand so far, then return tomorrow with a clear head.',s:{persistence:2,learning:2}}]}]},
{dim:'curiosity', vs:[
 {s:'A scan shows an unnamed service on port 8443 with a banner that matches nothing in any database you know.', o:[
  {t:'Manually interact with it: raw connections, odd verbs, observe every byte of its behavior.',s:{curiosity:3,research:1}},
  {t:'Mark it as unknown and exclude it — unidentified services are usually noise.',s:{curiosity:0}},
  {t:'Research the fingerprint across security forums and vendor docs before touching it.',s:{research:3,curiosity:2}},
  {t:'Run a full automated vulnerability scan against it and move on.',s:{persistence:1}}]},
 {s:'While reviewing a client\'s public DNS, you notice a strange TXT record that looks like base64 and no one at the client recognizes it.', o:[
  {t:'Decode it, trace which name server set it, and build a timeline — you want the whole story.',s:{curiosity:3,analytical:2}},
  {t:'Report it as an anomaly and let the client investigate the meaning.',s:{persistence:1}},
  {t:'Ignore it — TXT records are rarely security-relevant.',s:{curiosity:0}},
  {t:'Correlate it with other unusual records across their domains to find a pattern.',s:{research:3,analytical:1}}]},
 {s:'Buried in a minified JavaScript bundle you find a reference to an undocumented endpoint: /internal/v2/diagnostics.', o:[
  {t:'Probe it carefully with unauthenticated requests first, mapping what it reveals before anything louder.',s:{curiosity:3,problem_solving:2}},
  {t:'Skip it — internal endpoints are never exposed intentionally.',s:{curiosity:0}},
  {t:'Trace the JS to reconstruct the parameters it expects, then test precisely.',s:{analytical:3,research:2}},
  {t:'Blindly throw a fuzzer at it to see what sticks.',s:{problem_solving:1,creativity:1}}]}]},
{dim:'adaptability', vs:[
 {s:'Your approved phishing path is blocked mid-campaign: the gateway now strips your exact delivery method, and half the targets remain.', o:[
  {t:'Analyze what the gateway allows through and engineer a variant that fits, staying inside the ROE.',s:{adaptability:3,creativity:2}},
  {t:'Restart the same campaign with a new sender domain and identical payload.',s:{creativity:1,persistence:1}},
  {t:'Stop the campaign and report partial completion.',s:{persistence:0}},
  {t:'Switch targets to a different vector entirely (vishing) that the gateway cannot touch.',s:{adaptability:2,creativity:2}}]},
 {s:'Two days into the engagement, the client patches the exact vulnerability your whole attack plan depended on.', o:[
  {t:'Treat the patch diff as new intel — it often reveals adjacent, unpatched flaws.',s:{creativity:3,analytical:2,learning:1}},
  {t:'Complain to the client that mid-engagement patching invalidates the assessment.',s:{adaptability:0}},
  {t:'Fall back to your second-priority attack path you mapped in planning.',s:{adaptability:3,problem_solving:1}},
  {t:'Rush to exploit it before the patch deploys everywhere.',s:{adaptability:1}}]},
 {s:'Physical access assessment: your planned entry window fails — the lobby added a security desk yesterday.', o:[
  {t:'Observe the new routine for an hour and adapt your approach to the observed rhythm.',s:{adaptability:3,curiosity:2}},
  {t:'Abort the physical phase; the plan is dead.',s:{adaptability:0}},
  {t:'Try a completely different, pre-authorized access route you scouted earlier.',s:{adaptability:2,persistence:2}},
  {t:'Walk in confidently as if you belong and hope the desk does not ask.',s:{creativity:1}}]}]},
{dim:'learning', vs:[
 {s:'You discover a promising attack technique published last week. Nobody on your team has used it. Your current engagement could benefit from it.', o:[
  {t:'Rebuild it in your own lab first; only touch the client when it behaves predictably.',s:{learning:3,persistence:2}},
  {t:'Try it directly on the client — real targets are the best teacher.',s:{learning:0}},
  {t:'Read the paper thoroughly, then hand-test one safe, read-only step on the client.',s:{learning:2,analytical:2}},
  {t:'Wait until someone else validates it in the community.',s:{learning:1}}]},
 {s:'Deadline is tomorrow. Option A: a fast, noisy scan that may trip detection. Option B: a slow manual path that definitely fits the timeframe but finds less.', o:[
  {t:'Choose B and compensate with sharp prioritization of what manual time you spend on.',s:{analytical:3,persistence:2}},
  {t:'Choose A — coverage matters more than stealth on a deadline.',s:{problem_solving:1}},
  {t:'Do A against one low-risk segment and B on the crown jewels, balancing both.',s:{creativity:3,problem_solving:2,adaptability:1}},
  {t:'Ask the client which they would prefer and follow orders.',s:{analytical:0}}]},
 {s:'During testing you accidentally access data clearly outside your scope. It looks serious.', o:[
  {t:'Stop immediately, preserve minimal evidence, and report the overreach transparently to the client contact.',s:{analytical:2,persistence:1}},
  {t:'Document everything thoroughly, do not download anything, and escalate through the agreed emergency channel.',s:{learning:3,analytical:3}},
  {t:'Leave without reporting — you were not supposed to be there.',s:{learning:0}},
  {t:'Continue briefly to understand the blast radius before reporting.',s:{learning:1}}]}]}];

/* ---------- انیمیشن پس‌زمینه: مسیر حملهٔ زنده (attack-path) ---------- */
(function(){
 const cv=$('#bg'),ctx=cv.getContext('2d');let W,H,nodes=[],path=null,t0=0;
 function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;const n=innerWidth<700?16:30;nodes=[];
  for(let i=0;i<n;i++)nodes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()<.18?2.2:1.4,red:Math.random()<.12});
  nodes.forEach(nd=>{nd.nb=nodes.filter(m=>m!==nd).sort((a,b)=>((a.x-nd.x)**2+(a.y-nd.y)**2)-((b.x-nd.x)**2+(b.y-nd.y)**2)).slice(0,3)})}
 rs();addEventListener('resize',rs);
 function newPath(){const s=nodes[Math.floor(Math.random()*nodes.length)];const hops=[];let cur=s;for(let i=0;i<3+Math.floor(Math.random()*3);i++){if(!cur.nb.length)break;cur=cur.nb[Math.floor(Math.random()*cur.nb.length)];hops.push(cur)}path={s,hops,born:performance.now()}}
 setInterval(()=>{if(!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)newPath()},2600);
 function frame(t){ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(153,154,147,0.10)';nodes.forEach(nd=>{nd.nb.forEach(m=>{ctx.beginPath();ctx.moveTo(nd.x,nd.y);ctx.lineTo(m.x,m.y);ctx.stroke()})});
  nodes.forEach(nd=>{ctx.fillStyle=nd.red?'rgba(227,30,39,0.4)':'rgba(153,154,147,0.28)';ctx.beginPath();ctx.arc(nd.x,nd.y,nd.r,0,7);ctx.fill()});
  if(path){const age=t-path.born,life=2200;const seg=Math.min(path.hops.length,Math.floor(age/(life/path.hops.length))+1);
   if(age<life){ctx.strokeStyle='rgba(227,30,39,0.55)';ctx.lineWidth=1.2;ctx.beginPath();let px=path.s.x,py=path.s.y;ctx.moveTo(px,py);
    for(let i=0;i<seg;i++){const p=path.hops[i];const f=Math.min(1,(age-(i*life/path.hops.length))/(life/path.hops.length));ctx.lineTo(px+(p.x-px)*f,py+(p.y-py)*f);px=p.x;py=p.y}ctx.stroke()}else path=null}
  requestAnimationFrame(frame)}
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(frame);
})();

/* ---------- ۸. موتور امتیاز طرز فکر ---------- */
function computeMindset(){const sc={};DIMS.forEach(([d])=>sc[d]=0);
 S.mind.ans.forEach((ai,qi)=>{if(ai===null)return;const o=S.mind.q[qi].opts[ai];Object.entries(o.s).forEach(([d,v])=>sc[d]+=v)});
 S.mind.scores={};DIMS.forEach(([d])=>S.mind.scores[d]=clamp(Math.round(36+sc[d]*4.3),4,99));save()}
function prelimRank(){const avg=d=>S.mind.scores[d]||50;const w=[.5,.3,.2];
 return SPECS.map(sp=>{let v=0;sp.dims.forEach((d,i)=>v+=w[i]*avg(d));let bonus=0;
  sp.areas.forEach(a=>{if(S.profile.areas.includes(a))bonus+=2});if(S.discover.interests.includes(sp.id))bonus+=3;
  return{id:sp.id,score:Math.round(Math.min(99,v+bonus))}}).sort((a,b)=>b.score-a.score)}

/* ---------- ۱۰. تولید آزمون stratified (دسته‌ای متوازن) ---------- */
function initTech(){const bank=KB[S.sel.primary];const byCat={};bank.q.forEach((q,i)=>{(byCat[q.c]=byCat[q.c]||[]).push(i)});
 // از هر دسته یک سؤال، سپس مابقی تصادفی — ترتیب گزینه‌ها نیز شافل
 let picked=[];Object.keys(byCat).forEach(c=>picked.push(byCat[c][Math.floor(Math.random()*byCat[c].length)]));
 bank.q.forEach((q,i)=>{if(!picked.includes(i))picked.push(i)});picked=picked.slice(0,8);
 S.tech.qs=picked.map(i=>{const q=bank.q[i];const correct=q.o[q.a];const os=shuffle(q.o);

function computePractical(){
 const P=PRAC[S.sel.primary];const g=(c,i)=>c.o[S.prac.ans[i]]?.s||0;
 const reasoning=g(P.c1,0)/2*100, method=g(P.c2,1)/2*100, adapt=g(P.c3,2)/2*100;
 const note=P.note.q.toLowerCase();const t=S.prac.note.toLowerCase();
 const hits=P.note.kw.filter(k=>t.includes(k)).length;const doc=Math.min(100,hits/P.note.kw.length*110);
 const ps=Math.round((g(P.c2,1)*.5+g(P.c1,0)*.3+g(P.c3,2)*.2)/2*100);
 const total=Math.round(reasoning*.25+ps*.25+method*.20+adapt*.15+doc*.15);
 S.prac.res={total,dims:{'TECHNICAL REASONING':Math.round(reasoning),'PROBLEM SOLVING':ps,'METHODOLOGY':Math.round(method),'ADAPTABILITY':Math.round(adapt),'DOCUMENTATION':Math.round(doc)}};save()}

 let interest=interestSelf?100:(S.sel.suggested?78:60);if(S.discover.interests.includes(S.sel.primary))interest=Math.min(100,interest+10);
 const tech=S.tech.res.total, prac=S.prac.res?.total||0, ps=ms.problem_solving;
 const fit=Math.round(mindsetAvg*.20+interest*.15+tech*.25+prac*.30+ps*.10);
 const gate=tech>=70&&prac>=65;
 const tier=fit>=85?['EXCELLENT FIT','ok']:fit>=75?['STRONG FIT','ok']:fit>=65?['POTENTIAL FIT','wh']:fit>=50?['DEVELOPING','']:['POOR FIT','red'];
 const pool=rank.filter(r=>r.id!==S.sel.primary&&(!S.sel.secondary||r.id!==S.sel.secondary));
 let secondary=S.sel.secondary||pool[0]?.id;const support=pool.find(r=>r.id!==secondary)?.id||pool[0]?.id;
 const spec=specById(S.sel.primary);const weakDims=DIMS.filter(([d])=>ms[d]<60).map(([d])=>DIM_FA[d]);
 const strengths=DIMS.filter(([d])=>ms[d]>=80).map(([d])=>DIM_FA[d]).slice(0,4);
 const weakCats=(S.tech.res.cats||[]).filter(c=>c.score<70);
 const learning=[...weakCats.map(c=>KB[S.sel.primary].adv[S.tech.res.cats.indexOf(c)]),
  weakDims.length?`تقویت ${weakDims.join(' و ')} با تمرین سناریومحور`:'حفظ ریتم یادگیری — مسیر فشرده‌تر پیشرفته'].filter(Boolean);
 S.result={cid:S.cid,created:S.created,updated:now(),
  name:(S.profile.first+' '+S.profile.last).trim(),major:S.profile.major,level:S.profile.level||'—',

  strengths,weakCats:weakCats.map(c=>c.cat),learning,techPassed:S.tech.res.passed};
 save();
 dbUpsert(JSON.parse(JSON.stringify(S.result)));S.submitted=true;save();
}

 S.tg.attempts++;
 if(!tgConfigured()){S.tg.status='failed';S.tg.last='token not configured';save();toast('توکن تلگرام تنظیم نشده.');return}
 // ارسال از طریق fetch با mode:'no-cors' تا مشکل CORS مرورگر حل شود
 const url=`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`;
 const body=new URLSearchParams({chat_id:TG_CHAT,text:buildTgMessage(r),parse_mode:'HTML'});
 fetch(url,{method:'POST',mode:'no-cors',body:body})
  .then(()=>{
    S.tg.status='sent';S.tg.last=now();logTg(r,'sent',now());
    toast('گزارش به تلگرام ارسال شد ✅',true);
  })
  .catch(e=>{
    S.tg.status='failed';S.tg.last=String(e);logTg(r,'failed',String(e));
    toast('ارسال ناموفق — در لاگ ثبت شد.');
  })
  .finally(()=>save());
}
function logTg(r,st,info){const a=dbAll();const c=a.find(x=>x.cid===r.cid);if(c){c.tg={status:st,attempts:S.tg.attempts,last:info};dbSave(a)}}

/* ======================= ۱۸–۲۰. ADMIN ======================= */
let adminOpen=false,sortKey='fit',sortAsc=false,viewCid=null;
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function renderAdmin(){
 if(!adminOpen){$('#app').innerHTML=`<div class="wrap fadein" style="max-width:480px"><div class="panel acc">
  <div class="sec-label">ADMIN ACCESS</div><h2>RESTRICTED</h2>
  <label class="fl">ADMIN PASSWORD</label><input type="password" id="apw" class="mono">
  <p class="term" style="margin-top:10px;opacity:.65">demo password: redteam — در پروداکشن: bcrypt/argon2 hash سمت سرور (ADMIN_PASSWORD_HASH)</p>
  <div class="navrow"><button class="btn ghost" onclick="go(S.step='welcome');renderWelcome()">◂ BACK</button><button class="btn" id="bLogin">AUTHENTICATE ▸</button></div>
 </div></div>`;
  $('#apw').focus();
  const tryL=async()=>{const h=await sha256($('#apw').value);const def=await sha256('redteam');
   const stored=localStorage.getItem('rt_admin_hash');if(h===def||h===stored){adminOpen=true;sessionStorage.setItem('rt_adm','1');renderAdmin()}else toast('رمز نادرست.')};
  $('#bLogin').onclick=tryL;$('#apw').onkeydown=e=>{if(e.key==='Enter')tryL()};return}
 const all=dbAll();const done=all.filter(c=>c.fit!=null);
 const passed=done.filter(c=>c.techPassed).length, failed=done.length-passed, pending=all.length-done.length;
 $('#app').innerHTML=`<div class="fadein">
  <div class="panel acc"><div class="sec-label">ADMIN DASHBOARD // TEAM PLACEMENT</div>
   <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center">
    <h2>CANDIDATE OVERVIEW</h2><button class="btn ghost sm" id="bSeed">LOAD DEMO CANDIDATES</button></div>
   <div class="statgrid" style="margin-top:16px">
    <div class="stat"><div class="n">${all.length}</div><div class="l">TOTAL</div></div>
    <div class="stat"><div class="n" style="color:var(--ok)">${passed}</div><div class="l">PASSED KNOWLEDGE</div></div>
    <div class="stat"><div class="n" style="color:var(--red)">${failed}</div><div class="l">NOT READY</div></div>
    <div class="stat"><div class="n">${pending}</div><div class="l">IN PROGRESS</div></div>
   </div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="sec-label">SPECIALIZATION DISTRIBUTION</div>
   <div id="dist"></div><div id="balance" style="margin-top:10px"></div></div>
  <div class="panel" style="margin-top:16px;overflow-x:auto"><div class="sec-label">CANDIDATE RANKING — click header to sort · click row to open profile</div>
   <table class="tbl"><thead><tr>${[['cid','CANDIDATE'],['primary','PRIMARY'],['secondary','SECONDARY'],['mindset','MINDSET'],['tech','TECHNICAL'],['prac','PRACTICAL'],['fit','FIT ▾'],['status','STATUS']].map(([k,l])=>`<th data-k="${k}">${l}</th>`).join('')}</tr></thead>
   <tbody id="tbody"></tbody></table></div>
  <div class="panel" style="margin-top:16px"><div class="sec-label g">TELEGRAM SETTINGS (هاردکد در ابتدای اسکریپت — برای تغییر، TG_TOKEN و TG_CHAT را ویرایش کنید)</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div><label class="fl">BOT TOKEN</label><input type="text" value="${esc(TG_TOKEN)}" readonly></div>
    <div><label class="fl">CHAT ID</label><input type="text" value="${esc(TG_CHAT)}" readonly></div></div>
   <p class="term" style="margin-top:8px;opacity:.6">ارسال از طریق Bot API با <code>fetch(mode:'no-cors')</code> انجام می‌شود. این تنظیمات در بالای فایل اسکریپت قابل ویرایش است.</p>
  </div>
  <div class="navrow" style="margin-top:20px"><button class="btn ghost" onclick="adminOpen=false;go('welcome')">◂ EXIT ADMIN</button><span></span></div>
 </div>`;
 $('#bSeed').onclick=()=>{seedDemo();renderAdmin()};
 const sorted=[...done].sort((a,b)=>(a[sortKey]>b[sortKey]?1:-1)*(sortAsc?1:-1));
 $('#tbody').innerHTML=sorted.map(c=>`<tr class="rrow" data-c="${c.cid}">
  <td>${esc(c.name)}<br><span style="color:var(--gray);font-size:10px">${c.cid}</span></td>
  <td>${specById(c.primary)?.n||'—'}</td><td>${c.secondary?specById(c.secondary).n:'—'}</td>
  <td>${c.mindset}</td><td style="color:${c.tech>=70?'var(--ok)':'var(--red)'}">${c.tech}</td>
  <td>${c.prac}</td><td style="color:var(--red);font-weight:700">${c.fit}</td>
  <td><span class="tag ${c.status==='Strong Candidate'?'ok':c.status==='Needs Development'?'red':'wh'}">${c.status}</span></td></tr>`).join('');
 document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=false}renderAdmin()});
 document.querySelectorAll('.rrow').forEach(r=>r.onclick=()=>openDrawer(r.dataset.c));
 // توزیع + توازن تیم (بخش ۱۹)
 const counts={};done.forEach(c=>counts[c.primary]=(counts[c.primary]||0)+1);
 const mx=Math.max(1,...Object.values(counts));
 $('#dist').innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="barrow"><span class="bl">${specById(id)?.n||id}</span><div class="btrack"><div class="bfill red" style="width:${n/mx*100}%"></div></div><span class="bv">${n}</span></div>`).join('')||'<p class="term">هیچ کاندید تکمیل‌شده‌ای نیست.</p>';
 const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
 if(top&&done.length>=3&&top[1]/done.length>0.35){
  const weakSpecs=SPECS.filter(s=>!counts[s.id]).map(s=>s.id);
  const cands=done.filter(c=>weakSpecs.includes(c.secondary)&&c.fit>=65).slice(0,3);
  $('#balance').innerHTML=`<div style="border:1px solid var(--red-dim);border-radius:5px;padding:14px 16px;background:rgba(227,30,39,.05)">
   <span class="tag red">TEAM BALANCE WARNING</span>
   <p class="term" style="margin-top:8px">تمرکز بیش‌ازحد روی <b style="color:var(--white)">${specById(top[0]).n}</b> (${Math.round(top[1]/done.length*100)}٪ از کاندیدها). کاندیدهای با تناسب ثانویهٔ قوی در تخصص‌های کم‌نماینده: ${cands.map(c=>esc(c.name)+' → '+specById(c.secondary).n).join(' · ')||'— بررسی دستی پیشنهاد می‌شود.'}</p></div>`;
 }else $('#balance').innerHTML='';
}
function openDrawer(cid){
 const c=dbAll().find(x=>x.cid===cid);if(!c)return;viewCid=cid;
 const d=document.createElement('div');d.className='drawer open';
 const rows=[['CANDIDATE',`${c.name} · ${c.cid}`],['BACKGROUND',`${c.major} · ${c.level}`],['MINDSET DETAIL',Object.entries(c.mindsetDetail||{}).map(([k,v])=>`<span class="tag ${dimTier(v)[1]==='red'?'red':dimTier(v)[1]==='ok'?'ok':''}">${DIM_FA[k]} ${v}</span>`).join(' ')],['TECHNICAL',(c.techCats||[]).map(t=>`<span class="tag ${t.score>=70?'ok':'red'}">${t.cat} ${t.score}%</span>`).join(' ')],['PRACTICAL DIMS',Object.entries({}).length?'':'—'],['PRIMARY',`${specById(c.primary)?.n} — ${c.fit}% ${c.tier[0]}`],['SECONDARY',c.secondary?specById(c.secondary).n:'—'],['SUPPORT',c.support?specById(c.support).n:'—'],['STATUS',c.status],['LEARNING',(c.learning||[]).map(l=>'→ '+l).join('<br>')],['TELEGRAM',`${c.tg?.status||'pending'} · ${c.tg?.attempts||0} attempts`]];
 d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div class="sec-label">CANDIDATE PROFILE // ${c.cid}</div>
  <button class="btn ghost sm" id="dX">✕</button></div>
  ${rows.map(([k,v])=>`<div style="margin:16px 0"><div class="sec-label g">${k}</div><div class="term" style="color:var(--white)">${v||'—'}</div></div>`).join('')}
  <button class="btn sm" id="dRetry" style="margin-top:10px">↻ RESEND TO TELEGRAM</button>`;
 document.body.appendChild(d);$('#dX')||0;
 d.querySelector('#dX').onclick=()=>d.remove();
 d.querySelector('#dRetry').onclick=()=>{
  const body=new URLSearchParams({chat_id:TG_CHAT,text:buildTgMessage(c),parse_mode:'HTML'});
  fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',mode:'no-cors',body})
   .then(()=>{const a=dbAll();const x=a.find(v=>v.cid===cid);x.tg={status:'sent',attempts:(x.tg?.attempts||0)+1,last:now()};dbSave(a);toast('ارسال مجدد اجرا شد ✅',true)})
   .catch(()=>toast('ارسال مجدد ناموفق'))};
 d.onclick=e=>{if(e.target===d)d.remove()};
}
/* داده‌های نمونه برای حس زندهٔ داشبورد */
function seedDemo(){const names=[['سارا محمدی','مهندسی نرم‌افزار','Intermediate'],['amir hosseini','IT','Beginner'],['نگار کریمی','مهندسی کامپیوتر','Advanced'],['d.rahmani','برق','Intermediate'],['مهدی تهرانی','علوم کامپیوتر','Beginner']];
 const sp=SPECS.map(s=>s.id);let n=0;
 for(const[nm,mj,lv]of names){const pick=()=>sp[Math.floor(Math.random()*sp.length)];
  const mk=()=>{const o={};DIMS.forEach(([d])=>o[d]=45+Math.floor(Math.random()*50));return o};
  const p=pick();const tc=KB[p].cats.map(c=>({cat:c,score:35+Math.floor(Math.random()*62)}));
  const tech=Math.round(tc.reduce((s,c)=>s+c.score,0)/tc.length);
  const msD=mk();const mindset=Math.round(Object.values(msD).reduce((a,b)=>a+b,0)/8);
  const prac=40+Math.floor(Math.random()*58);const fit=clamp(Math.round(mindset*.2+80*.15+tech*.25+prac*.3+msD.problem_solving*.1),20,97);
  const gate=tech>=70&&prac>=65;const tier=fit>=85?'EXCELLENT FIT':fit>=75?'STRONG FIT':fit>=65?'POTENTIAL FIT':fit>=50?'DEVELOPING':'POOR FIT';
  const pool=prelimRankFor(msD,sp.filter(x=>x!==p));
  const rec={cid:uid(),created:now(),updated:now(),name:nm,major:mj,level:lv,mindset,mindsetDetail:msD,tech,techCats:tc,prac,ps:msD.problem_solving,fit,tier:[tier],gate,primary:p,secondary:pool[0],support:pool[1],
   status:!gate?'Needs Development':fit>=80?'Strong Candidate':fit>=65?'Recommended':'Needs Development',strengths:[DIM_FA.analytical,'پشتکار'],weakCats:tc.filter(c=>c.score<70).map(c=>c.cat).slice(0,2),learning:['تمرین سناریومحور','مطالعهٔ عمیق‌تر پروتکل‌ها'],techPassed:tech>=70,tg:{status:Math.random()<.7?'sent':'failed',attempts:1,last:now()}};
  dbUpsert(rec);n++}
 toast(`${n} کاندید نمونه اضافه شد.`,true)}
function prelimRankFor(ms,ids){const w=[.5,.3,.2];const avg=d=>ms[d]||50;
 return ids.map(id=>{const s=specById(id);let v=0;s.dims.forEach((dd,i)=>v+=w[i]*avg(dd));return{id,score:Math.round(v)}}).sort((a,b)=>b.score-a.score).map(r=>r.id)}

/* ---------- بوت ---------- */
S=loadS()||freshState();
if(!S.token)S.token=mkToken();
drawStages();R[S.step]();
</script>
